<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- PropCloud favicon: green cloud + location pin. Solid fill for legibility
       at 16px (the full wordmark logo uses outlined strokes; this is the
       small-size adaptation). Green gradient mirrors the brand mark. -->
  <defs>
    <linearGradient id="pcGreen" x1="6" y1="8" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ED957"/>
      <stop offset="1" stop-color="#1F9E2E"/>
    </linearGradient>
  </defs>
  <!-- Cloud silhouette -->
  <path fill="url(#pcGreen)" d="M14.5 39C7.6 39 2 33.6 2 27c0-6.1 4.8-11.1 10.9-11.7C15 10.2 19.9 7 25.5 7c7 0 12.8 5.3 13.4 12.1C43.1 20 46 23.6 46 28c0 6.1-5 11-11.2 11H14.5z"/>
  <!-- Location pin (white cutout) -->
  <path fill="#ffffff" d="M24 16.5c-4.6 0-8.3 3.6-8.3 8.1 0 5.7 7.3 12.1 7.6 12.4.4.3 1 .3 1.4 0 .3-.3 7.6-6.7 7.6-12.4 0-4.5-3.7-8.1-8.3-8.1z"/>
  <!-- Pin center dot -->
  <circle cx="24" cy="24.4" r="3.1" fill="url(#pcGreen)"/>
</svg>
